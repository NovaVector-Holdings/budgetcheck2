name: CI

# CEO directive, "PR #10 CONSOLIDATED TRUST CLOSURE" Part G: wire the
# repo's deterministic grounding validation into CI using only existing,
# free infrastructure. This repo has no CI configured today -- this is
# the first workflow file added. GitHub Actions' free tier for a public
# or private repo under a personal/org free plan is the "existing/free
# infrastructure" this satisfies; nothing paid is introduced.
#
# NOTE FOR THE RETURN PACKAGE: merging this file makes it take effect
# immediately -- the very next push or pull_request event on this repo
# will actually run these jobs using real (if free-tier) GitHub Actions
# minutes. This is a live operational change, not just a yaml file.
#
# CEO / PRODUCT REVIEW, "PR #10 FINAL PRE-MERGE CLOSURE" (bounded
# correction 1): the first version of this workflow used
# `cache: npm` + `npm ci`, both of which require a committed
# package-lock.json. This repo's .gitignore intentionally excludes
# package-lock.json (see its own comment there) -- an existing,
# deliberate no-lockfile policy this correction does not change or
# silently override. `npm install --package-lock=false` installs from
# package.json only, generates no lockfile, and leaves that policy
# exactly as it was.
#
# Same correction, discovered running the fix above: `npm run lint`
# runs `eslint .` across the WHOLE repo, and this repo has never had
# CI, so pre-existing lint violations in 54 files this PR has never
# touched (unrelated routes, UI components, integrations) were never
# enforced and are not this PR's to fix -- a repo-wide autofix/cleanup
# is real, out-of-scope work, not a bounded CI correction. Scoped this
# step to exactly the files this Ask-a-Question trust-gate PR owns
# (its full diff against main, every round) instead, so the gate is
# meaningful for what this PR actually changed without silently taking
# on unrelated debt. Flagged as a separate follow-up recommendation in
# the return package: a repo-wide lint remediation, decided and scoped
# on its own, would let a future PR restore `npm run lint` here.
#
# CEO / PRODUCT PROGRAM DIRECTIVE, "BUDGETCHEK 2.0 DEFINITION OF DONE"
# Gate 0: the prior GREEN run still logged real EBADENGINE warnings --
# @tanstack/react-start and every @supabase/* package this repo depends
# on now require node >=22.12.0/>=22.0.0, while this workflow installed
# node-version: 20 (and GitHub itself is deprecating Node 20 runners).
# Non-fatal today, but a real, growing risk, not a hypothetical one.
# Aligned to the actually-supported runtime.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Floats on the Node 22 LTS line rather than pinning an exact
          # minor (e.g. "22.12") -- always satisfies the CEO's ">=22.12"
          # floor, and keeps picking up security patches within Node 22
          # without a future CI edit, consistent with this repo's own
          # no-lockfile "accept some drift, stay low-maintenance" stance.
          node-version: 22
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm run build
      - run: >
          npx eslint
          src/lib/grounding.ts
          src/lib/decision-engine.ts
          src/lib/mm-chat.functions.ts
          src/components/mm/assistant.tsx
          src/routes/_authenticated/money-meeting.tsx
          scripts/prove-grounding.ts
          scripts/prove-decision-engine.ts
      - run: npm run validate:grounding
      - run: npm run validate:decision-engine
