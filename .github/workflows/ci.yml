name: CI

# CEO directive, "PR #10 CONSOLIDATED TRUST CLOSURE" Part G: wire the
# repo's deterministic grounding validation into CI using only existing,
# free infrastructure. This repo has no CI configured today -- this is
# the first workflow file added. GitHub Actions' free tier for a public
# or private repo under a personal/org free plan is the "existing/free
# infrastructure" this satisfies; nothing paid is introduced.
#
# NOTE FOR THE RETURN PACKAGE: merging this file makes it take effect
# immediately -- the very next push or pull_request event on this repo
# will actually run these jobs using real (if free-tier) GitHub Actions
# minutes. This is a live operational change, not just a yaml file.
#
# CEO / PRODUCT REVIEW, "PR #10 FINAL PRE-MERGE CLOSURE" (bounded
# correction 1): the first version of this workflow used
# `cache: npm` + `npm ci`, both of which require a committed
# package-lock.json. This repo's .gitignore intentionally excludes
# package-lock.json (see its own comment there) -- an existing,
# deliberate no-lockfile policy this correction does not change or
# silently override. `npm install --package-lock=false` installs from
# package.json only, generates no lockfile, and leaves that policy
# exactly as it was.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock=false --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - run: npm run validate:grounding
      - run: npm run validate:decision-engine
